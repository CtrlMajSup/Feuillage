<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/logo/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/logo/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/logo/favicon-16x16.png' | relative_url }}">
  <link rel="android-chrome" type="image/png" sizes="32x32" href="{{ '/assets/images/logo/android-chrome-192x192.png'  | relative_url }}">
  <link rel="android-chrome" type="image/png" sizes="16x16" href="{{ '/assets/images/logo/android-chrome-512x512.png'  | relative_url }}">
  <link rel="manifest" href="{{ '/assets/images/logo/site.webmanifest'  | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/images/logo/favicon.ico' | relative_url }}">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

  {% include header.html %}

  <main class="site-main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
