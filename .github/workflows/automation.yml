name: Génération quotidienne par IA

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du dépôt
      uses: actions/checkout@v4

    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer la bibliothèque Google GenAI
      run: pip install google-genai

    - name: Générer la fiche avec l'IA
      env:
        # On passe la clé GitHub secrète au script Python
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
      run: python ./scripts/generer_fiche.py

    - name: Commit et Push
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add .
        if git diff --staged --quiet; then
          echo "Rien à commiter."
        else
          git commit -m "Auto: Nouvelle fiche IA du $(date +%Y-%m-%d)"
          git push
        fi
